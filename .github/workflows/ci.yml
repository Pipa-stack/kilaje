name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: install → typecheck → lint → test → build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` needs the lockfile to match package.json exactly, which also
      # pins the SheetJS tarball served from the vendor CDN.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The suite runs against PGlite (PostgreSQL compiled to WASM), so it
      # needs no database service. The parser tests read the real workbook, so
      # a template regression fails CI rather than reaching a phone in a gym.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  postgres:
    name: tests against a real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The default suite uses PGlite for speed and zero setup. This job runs the
    # same tests against a genuine PostgreSQL server, which is what would catch
    # any behaviour that differs between the WASM build and what Railway runs.
    services:
      postgres:
        # Credentials are throwaway values for an ephemeral container that is
        # only reachable from this job. Nothing real is stored in the repo.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barra_test?sslmode=disable
        run: npm test
