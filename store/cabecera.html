<!doctype html>
<!-- Fuente de la imagen de cabecera de Google Play (1024x500). Se abre en un
     navegador a ese tamaño y se captura; ver store/README.md. -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url('../public/fonts/barlow-condensed-700.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 500; src: url('../public/fonts/barlow-500.woff2') format('woff2'); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { background: #0e100f; color: #f2f4f0; font-family: 'Barlow', sans-serif; display: flex; align-items: center; }
  .band { position: absolute; right: 0; top: 0; bottom: 0; width: 380px; background: #f2c200; }
  .band img { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; transform: translate(-50%, -50%); border-radius: 48px; }
  .text { position: relative; padding-left: 72px; width: 560px; }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 104px; line-height: .9; margin: 0 0 20px; letter-spacing: -1px; text-transform: uppercase; }
  p { font-size: 32px; line-height: 1.25; margin: 0; color: #d8ddd8; }
  p strong { color: #f2c200; font-weight: 500; }
</style>
</head>
<body>
  <div class="text">
    <h1>Kilaje</h1>
    <p>Reserva tus clases del gimnasio y <strong>lleva tu entrenamiento</strong> en una sola app.</p>
  </div>
  <div class="band"><img src="../public/icons/icon-512.png" alt=""></div>
</body>
</html>
